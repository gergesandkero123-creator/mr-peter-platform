<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | منصة الأستاذ بيتر</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: #262626;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            color: #ff9800;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #444;
            border-radius: 5px;
            background-color: #333;
            color: #fff;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #ff9800;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #ff9800;
            border: none;
            border-radius: 5px;
            color: #1a1a1a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
        }

        button:hover {
            background-color: #e68a00;
        }

        .toggle-link {
            margin-top: 20px;
            font-size: 14px;
            color: #bbb;
        }

        .toggle-link a {
            color: #ff9800;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h2 id="form-title">تسجيل الدخول للطلاب</h2>

        <form id="auth-form">
            <input type="text" id="student-name" placeholder="اسم الطالب بالكامل" style="display: none;">
            <input type="email" id="email" placeholder="البريد الإلكتروني" required>
            <input type="password" id="password" placeholder="كلمة المرور" required>
            <button type="submit" id="submit-btn">دخول</button>
        </form>

        <div class="toggle-link">
            <span id="toggle-text">ليس لديك حساب؟</span>
            <a href="#" id="toggle-auth">إنشاء حساب جديد</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // الـ Config المعدل بالـ API Key الصحيح بنسبة 100%
        const firebaseConfig = {
            apiKey: "AIzaSyAOHbnkOxnmdPvZh9a4nrSmWB7HtNOVQXQ",
            authDomain: "mr-peter-platform.firebaseapp.com",
            projectId: "mr-peter-platform",
            storageBucket: "mr-peter-platform.firebasestorage.app",
            messagingSenderId: "753078677057",
            appId: "1:753078677057:web:1d2df6363aba8f3fd220c0",
            measurementId: "G-839N580RRJ"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isLoginMode = true;
        const toggleAuthLink = document.getElementById('toggle-auth');
        const formTitle = document.getElementById('form-title');
        const submitBtn = document.getElementById('submit-btn');
        const toggleText = document.getElementById('toggle-text');
        const studentNameInput = document.getElementById('student-name');
        const authForm = document.getElementById('auth-form');

        toggleAuthLink.addEventListener('click', (e) => {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            if (!isLoginMode) {
                formTitle.innerText = "إنشاء حساب طالب جديد";
                submitBtn.innerText = "تسجيل الحساب";
                toggleText.innerText = "لديك حساب بالفعل؟";
                toggleAuthLink.innerText = "تسجيل الدخول";
                studentNameInput.style.display = "block";
                studentNameInput.required = true;
            } else {
                formTitle.innerText = "تسجيل الدخول للطلاب";
                submitBtn.innerText = "دخول";
                toggleText.innerText = "ليس لديك حساب؟";
                toggleAuthLink.innerText = "إنشاء حساب جديد";
                studentNameInput.style.display = "none";
                studentNameInput.required = false;
            }
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const name = studentNameInput.value;

            if (isLoginMode) {
                try {
                    await signInWithEmailAndPassword(auth, email, password);
                    alert("تم تسجيل الدخول بنجاح!");
                    window.location.href = "dashboard.html";
                } catch (error) {
                    alert("خطأ في تسجيل الدخول: " + error.message);
                }
            } else {
                try {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    // حفظ بيانات الطالب في Firestore Database
                    await setDoc(doc(db, "users", user.uid), {
                        uid: user.uid,
                        name: name,
                        email: email,
                        status: "pending",
                        subscriptionStatus: "pending"
                    });

                    alert("تم إنشاء الحساب بنجاح وفي انتظار تفعيل المستر!");
                    authForm.reset();
                    toggleAuthLink.click();
                } catch (error) {
                    alert("خطأ في إنشاء الحساب: " + error.message);
                }
            }
        });
    </script>
</body>

</html>
